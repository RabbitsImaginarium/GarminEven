<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUD Debugger</title>
    <style>
        body { background-color: #111; color: #00FF66; font-family: monospace; padding: 10px; margin: 0; }
        #debug-log { background: #000; border: 1px solid #333; padding: 10px; height: 75vh; overflow-y: auto; font-size: 14px; white-space: pre-wrap; word-wrap: break-word; }
        button { margin-top: 15px; padding: 15px; width: 100%; background: #00FF66; color: #000; border: none; font-weight: bold; font-size: 16px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="debug-log">Initializing Debugger...<br></div>
    <button onclick="copyLogs()">Copy Logs to Clipboard</button>
    <script type="module" src="bundle.js"></script>
    <script>
        function copyLogs() {
            const text = document.getElementById("debug-log").innerText;
            navigator.clipboard.writeText(text).then(() => alert("Copied to clipboard!"));
        }
    </script>
</body>
</html>
